# 既知の脆弱性のうち、版を動かせないものだけをここに記録する (#1642)。
#
# **書かない判断も残す**。 記録が無いと「見落とした」 と「更新できないと決めた」 が
# 区別できず、毎回の監査で同じ検出を理由なしに繰り返すことになる。
#
# 記録してよいのは **実際に版を動かせないと測った** ものだけ。
# `pnpm update -r --depth Infinity <package>` で解消するものは記録せず更新する。
#
# 走らせ方と、この記録の見直し方は `README.md` の「依存関係の監査」 を見る。
#
# `ignoreUntil` は再確認の期限で、過ぎると osv-scanner が記録を無視して再び検出する。
# 期限が来たら上流が動いたかを見て、動いていれば更新して記録ごと消す。
#
# 記録は下の形で 1 件ずつ足す。
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-12-31
# reason = """
# 何が弱いか。版を動かせない理由と、届かない理由。期限に見るもの。
# """
