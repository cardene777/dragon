<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6e9"/>
      <stop offset="100%" stop-color="#f0e6d2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d6a8f"/>
      <stop offset="100%" stop-color="#4a8db5"/>
    </linearGradient>
    <filter id="raised" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" in="blur" result="offsetBlur"/>
      <feFlood flood-color="rgba(0,0,0,0.15)"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(80, 90)">
    <path d="M 0 30 L 60 0 L 60 60 Z" fill="url(#accent)" filter="url(#raised)"/>
    <text x="90" y="55" font-family="Inter, sans-serif" font-size="56" font-weight="700" fill="#1a1f2a">dragon</text>
  </g>
  <text x="80" y="270" font-family="Newsreader, serif" font-size="80" font-weight="500" fill="#1a1f2a">Animated</text>
  <text x="80" y="365" font-family="Newsreader, serif" font-size="80" font-weight="500" fill="#2d6a8f">Diagram DSL</text>
  <text x="80" y="465" font-family="Inter, sans-serif" font-size="28" fill="#5a6270">Mermaid 感覚 + phase / state / tween で動く SVG</text>
  <g transform="translate(80, 530)">
    <rect x="0" y="0" width="120" height="40" rx="20" fill="#2d6a8f"/>
    <text x="60" y="27" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#fdf6e9" text-anchor="middle">OSS</text>
    <rect x="140" y="0" width="180" height="40" rx="20" fill="transparent" stroke="#2d6a8f" stroke-width="2"/>
    <text x="230" y="27" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#2d6a8f" text-anchor="middle">Text DSL v0.5</text>
    <rect x="340" y="0" width="180" height="40" rx="20" fill="transparent" stroke="#2d6a8f" stroke-width="2"/>
    <text x="430" y="27" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#2d6a8f" text-anchor="middle">cdl engine</text>
  </g>
  <g transform="translate(800, 280)" opacity="0.4">
    <circle cx="100" cy="0" r="50" fill="none" stroke="#2d6a8f" stroke-width="3"/>
    <circle cx="100" cy="100" r="50" fill="none" stroke="#2d6a8f" stroke-width="3"/>
    <circle cx="200" cy="50" r="50" fill="none" stroke="#2d6a8f" stroke-width="3"/>
    <line x1="100" y1="50" x2="100" y2="50" stroke="#2d6a8f" stroke-width="2"/>
    <line x1="150" y1="0" x2="150" y2="50" stroke="#2d6a8f" stroke-width="2"/>
    <line x1="150" y1="100" x2="150" y2="50" stroke="#2d6a8f" stroke-width="2"/>
  </g>
</svg>
