<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ecf1"/>
      <stop offset="1" stop-color="#dde3ea"/>
    </linearGradient>
    <filter id="raised" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="10" dy="10" result="dark"/>
      <feFlood flood-color="rgba(163, 177, 198, 0.55)"/>
      <feComposite in2="dark" operator="in" result="darkColored"/>
      <feOffset in="blur" dx="-10" dy="-10" result="light"/>
      <feFlood flood-color="rgba(255, 255, 255, 0.95)"/>
      <feComposite in2="light" operator="in" result="lightColored"/>
      <feMerge>
        <feMergeNode in="darkColored"/>
        <feMergeNode in="lightColored"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- rocket badge -->
  <rect x="80" y="80" width="90" height="90" rx="20" fill="#2d6a8f"/>
  <text x="125" y="140" font-family="Inter, sans-serif" font-size="50" font-weight="700" fill="white" text-anchor="middle">🚀</text>
  <!-- title -->
  <text x="80" y="290" font-family="Inter, sans-serif" font-size="80" font-weight="700" fill="#1a1f2a">dragon</text>
  <text x="80" y="370" font-family="Inter, sans-serif" font-size="32" font-weight="500" fill="#5a6270">— animated diagram DSL</text>
  <!-- subtitle -->
  <text x="80" y="450" font-family="Inter, sans-serif" font-size="26" fill="#5a6270">Text DSL × 6 theme × Excalidraw / PCB / Neumorphism</text>
  <text x="80" y="490" font-family="Inter, sans-serif" font-size="26" fill="#5a6270">10 preset × live editor × share URL</text>
  <!-- demo nodes (Neumorphism raised) -->
  <g filter="url(#raised)">
    <rect x="720" y="170" width="180" height="80" rx="16" fill="#e8ecf1"/>
    <text x="810" y="215" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#2a2d36" text-anchor="middle">User</text>
    <rect x="720" y="290" width="180" height="80" rx="16" fill="#e8ecf1"/>
    <text x="810" y="335" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#2a2d36" text-anchor="middle">Service</text>
    <rect x="720" y="410" width="180" height="80" rx="16" fill="#e8ecf1"/>
    <text x="810" y="455" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#2a2d36" text-anchor="middle">Event</text>
  </g>
  <!-- connectors -->
  <path d="M 810 250 L 810 285" stroke="#4a7fc8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 810 370 L 810 405" stroke="#4a7fc8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="805,285 810,295 815,285" fill="#4a7fc8"/>
  <polygon points="805,405 810,415 815,405" fill="#4a7fc8"/>
  <!-- footer -->
  <text x="80" y="580" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" fill="#99a3b3">dragon-playground.vercel.app · MIT · 2026</text>
</svg>
