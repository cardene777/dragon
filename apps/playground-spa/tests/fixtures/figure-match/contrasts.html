<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>figure match contrasts</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .diagram {
      position: relative;
      width: 520px;
      height: 260px;
      overflow: hidden;
      background: transparent;
    }
    .content {
      position: absolute;
      inset: 0;
    }
    .box {
      position: absolute;
      top: 40px;
      width: 120px;
      height: 54px;
      border: 2px solid rgb(20, 58, 82);
      background: rgb(227, 233, 234);
      color: rgb(20, 58, 82);
    }
    .a { left: 40px; }
    .b { left: 200px; }
    .c { left: 360px; }
    .label {
      position: absolute;
      left: 10px;
      top: 14px;
      font: 600 16px/1 Arial, sans-serif;
      white-space: nowrap;
    }
    svg {
      position: absolute;
      inset: 0;
      width: 520px;
      height: 260px;
      pointer-events: none;
    }
    line { stroke: rgb(32, 64, 96); stroke-width: 2; }

    #width-10 .a { width: 130px; }
    #position-2 .a { left: 42px; }
    #position-2 .a .label { left: 8px; }
    #position-3 .a { left: 43px; }
    #position-3 .a .label { left: 7px; }
    #shift-22 .box { transform: translateX(22px); }
    #color .a { background: rgb(244, 220, 210); }
    #overlap .b { left: 120px; }
    #missing-text .c { display: none; }
    #order-reversed .a { left: 360px; }
    #order-reversed .c { left: 40px; }
    #connection-far .content svg { display: none; }
    #gradient .a { background: linear-gradient(90deg, rgb(224, 235, 244), rgb(180, 205, 225)); }
    #gradient-end .a { background: linear-gradient(90deg, rgb(224, 235, 244), rgb(160, 190, 215)); }
    #radial-gradient-a .a { background: radial-gradient(circle, rgb(224, 235, 244), rgb(180, 205, 225)); }
    #radial-gradient-b .a { background: radial-gradient(circle, rgb(224, 235, 244), rgb(160, 190, 215)); }
    #scale-0636 .content { transform: scale(0.636); transform-origin: 0 0; }
    #scale-0636 .label { font-size: 16.011px; }
    .extra-frame {
      position: absolute;
      left: 6px;
      top: 6px;
      width: 508px;
      height: 248px;
      border: 3px solid rgb(120, 80, 40);
      border-radius: 12px;
      pointer-events: none;
    }
    .sample {
      position: relative;
      width: 520px;
      height: 260px;
      overflow: hidden;
    }
    .region-text {
      position: absolute;
      font: 16px/1 Arial, sans-serif;
    }
    .region-keep { left: 40px; top: 40px; }
    .region-ignore { left: 80px; top: 90px; }
    .region-outside { left: 360px; top: 180px; }
    .font-sample {
      width: 260px;
      height: 80px;
      font-size: 10px;
    }
    #font-mono { font-family: monospace; }
    #font-serif { font-family: serif; }
    #transform-half line { stroke-width: 4; }
    .line-sample { width: 260px; height: 80px; }
    .line-sample path { fill: none; stroke: rgb(32, 64, 96); stroke-width: 2; }
    .outside-label-html .node {
      position: absolute;
      top: 70px;
      width: 120px;
      height: 80px;
    }
    .outside-label-html .node:first-of-type { left: 40px; }
    .outside-label-html .node:last-of-type { left: 300px; }
    .outside-label-html .outside-name {
      position: absolute;
      bottom: calc(100% + 4px);
      left: 0;
      color: rgb(20, 58, 82);
      font: 600 16px/1 Arial, sans-serif;
    }
    .outside-label-html .meter {
      position: absolute;
      inset: 0;
      border: 2px solid rgb(20, 58, 82);
      background: rgb(227, 233, 234);
    }
    .arrow-html .node {
      position: absolute;
      top: 70px;
      width: 120px;
      height: 80px;
      border: 2px solid rgb(20, 58, 82);
      background: rgb(227, 233, 234);
    }
    .arrow-html .node:first-of-type { left: 40px; }
    .arrow-html .node:last-of-type { left: 300px; }
    .arrow-html .node span {
      color: rgb(20, 58, 82);
      font: 600 16px/1 Arial, sans-serif;
    }
    .layered-edge { fill: none; }
    .layered-edge.main {
      stroke: rgb(220, 164, 67);
      stroke-width: 7;
      filter: drop-shadow(0 0 3px rgb(220 164 67 / 60%));
    }
    .layered-edge.outline {
      stroke: rgb(29, 36, 46);
      stroke-width: 14;
    }
  </style>
</head>
<body>
  <template id="contents">
    <div class="content">
      <div class="box a"><span class="label">Alpha</span></div>
      <div class="box b"><span class="label">Beta</span></div>
      <div class="box c"><span class="label">Gamma</span></div>
      <svg viewBox="0 0 520 260" aria-hidden="true"><line x1="100" y1="67" x2="420" y2="67"></line></svg>
    </div>
  </template>
  <main>
    <section class="diagram templated" id="base"></section>
    <section class="diagram templated" id="same"></section>
    <section class="diagram templated" id="width-10"></section>
    <section class="diagram templated" id="position-2"></section>
    <section class="diagram templated" id="position-3"></section>
    <section class="diagram templated" id="shift-22"></section>
    <section class="diagram templated" id="color"></section>
    <section class="diagram templated" id="overlap"></section>
    <section class="diagram templated" id="missing-text"></section>
    <section class="diagram templated" id="order-reversed"></section>
    <section class="diagram templated" id="connection-far">
      <svg viewBox="0 0 520 260" aria-hidden="true"><line x1="20" y1="210" x2="500" y2="210"></line></svg>
    </section>
    <section class="diagram templated" id="gradient"></section>
    <section class="diagram templated" id="gradient-end"></section>
    <section class="diagram templated" id="radial-gradient-a"></section>
    <section class="diagram templated" id="radial-gradient-b"></section>
    <svg class="font-sample" id="pattern-a" viewBox="0 0 260 80">
      <defs>
        <pattern id="pattern-a-fill" width="12" height="12" patternUnits="userSpaceOnUse">
          <rect width="12" height="12" fill="rgb(224, 235, 244)"></rect>
          <path d="M 0 12 L 12 0" stroke="rgb(32, 64, 96)" stroke-width="2"></path>
        </pattern>
      </defs>
      <rect x="20" y="10" width="220" height="60" fill="url(#pattern-a-fill)" stroke="rgb(32, 64, 96)" stroke-width="2"></rect>
      <text x="40" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="rgb(20, 40, 60)">Pattern</text>
    </svg>
    <svg class="font-sample" id="pattern-b" viewBox="0 0 260 80">
      <defs>
        <pattern id="pattern-b-fill" width="12" height="12" patternUnits="userSpaceOnUse">
          <rect width="12" height="12" fill="rgb(244, 220, 210)"></rect>
          <path d="M 0 0 L 12 12" stroke="rgb(120, 80, 40)" stroke-width="2"></path>
        </pattern>
      </defs>
      <rect x="20" y="10" width="220" height="60" fill="url(#pattern-b-fill)" stroke="rgb(32, 64, 96)" stroke-width="2"></rect>
      <text x="40" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="rgb(20, 40, 60)">Pattern</text>
    </svg>
    <section class="diagram templated" id="mask-hidden">
      <svg viewBox="0 0 520 260" aria-hidden="true">
        <mask id="hidden-mask"><path d="M 20 220 L 500 220" stroke="white" stroke-width="60"></path></mask>
      </svg>
    </section>
    <section class="diagram templated" id="scale-0636"></section>
    <section class="diagram templated" id="frame-extra"><div class="extra-frame"></div></section>
    <section class="sample" id="transform-half">
      <svg viewBox="0 0 520 260" width="520" height="260">
        <g transform="scale(0.5)">
          <rect x="40" y="40" width="200" height="100" fill="rgb(224, 235, 244)" stroke="rgb(32, 64, 96)" stroke-width="4"></rect>
          <text x="80" y="100" font-size="20" fill="rgb(20, 40, 60)">Scaled</text>
          <line x1="40" y1="180" x2="240" y2="180" stroke="rgb(32, 64, 96)" stroke-width="4"></line>
        </g>
      </svg>
    </section>
    <section class="sample" id="region-expected">
      <span class="region-text region-keep">Keep</span>
      <span class="region-text region-ignore">Expected only</span>
      <span class="region-text region-outside">Outside expected</span>
    </section>
    <section class="sample" id="region-actual">
      <span class="region-text region-keep">Keep</span>
      <span class="region-text region-ignore">Actual only</span>
      <span class="region-text region-outside">Outside actual</span>
    </section>
    <svg class="font-sample" id="font-mono" viewBox="0 0 260 80">
      <text x="20" y="48" textLength="200" lengthAdjust="spacingAndGlyphs">Font sample</text>
    </svg>
    <svg class="font-sample" id="font-serif" viewBox="0 0 260 80">
      <text x="20" y="48" textLength="200" lengthAdjust="spacingAndGlyphs">Font sample</text>
    </svg>
    <svg class="line-sample" id="path-lines-one" viewBox="0 0 260 80">
      <path d="M 20 20 L 240 20 M 20 60 L 240 60"></path>
    </svg>
    <svg class="line-sample" id="path-lines-two" viewBox="0 0 260 80">
      <path d="M 20 20 L 240 20"></path>
      <path d="M 20 60 L 240 60"></path>
    </svg>
    <svg class="diagram" id="outside-label-svg" viewBox="0 0 520 260">
      <g data-cdl-edge data-cdl-from="Alpha" data-cdl-to="Gamma">
        <path d="M 160 110 L 300 110" fill="none" stroke="rgb(20, 58, 82)" stroke-width="2"></path>
      </g>
      <g data-cdl-node data-cdl-title="Alpha">
        <rect x="40" y="70" width="120" height="80" fill="rgb(227, 233, 234)"></rect>
        <rect x="40" y="70" width="120" height="80" fill="none" stroke="rgb(20, 58, 82)" stroke-width="2"></rect>
        <text x="40" y="64" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="rgb(20, 58, 82)">Alpha</text>
      </g>
      <g data-cdl-node data-cdl-title="Gamma">
        <rect x="300" y="70" width="120" height="80" fill="rgb(227, 233, 234)"></rect>
        <rect x="300" y="70" width="120" height="80" fill="none" stroke="rgb(20, 58, 82)" stroke-width="2"></rect>
        <text x="300" y="64" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="rgb(20, 58, 82)">Gamma</text>
      </g>
    </svg>
    <section class="diagram outside-label-html" id="outside-label-html">
      <svg viewBox="0 0 520 260" aria-hidden="true">
        <line x1="160" y1="110" x2="300" y2="110"></line>
      </svg>
      <div class="node">
        <span class="outside-name">Alpha</span>
        <div class="meter"></div>
      </div>
      <div class="node">
        <span class="outside-name">Gamma</span>
        <div class="meter"></div>
      </div>
    </section>
    <svg class="diagram" id="arrow-svg" viewBox="0 0 520 260">
      <path d="M 160 110 H 281" fill="none" stroke="rgb(20, 58, 82)" stroke-width="2"></path>
      <path d="M 300 110 L 281 101.5 L 281 118.5 Z" fill="rgb(20, 58, 82)"></path>
      <rect x="40" y="70" width="120" height="80" fill="rgb(227, 233, 234)" stroke="rgb(20, 58, 82)" stroke-width="2"></rect>
      <text x="50" y="116" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="rgb(20, 58, 82)">Alpha</text>
      <rect x="300" y="70" width="120" height="80" fill="rgb(227, 233, 234)" stroke="rgb(20, 58, 82)" stroke-width="2"></rect>
      <text x="310" y="116" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="rgb(20, 58, 82)">Gamma</text>
    </svg>
    <section class="diagram arrow-html" id="arrow-html">
      <svg viewBox="0 0 520 260" aria-hidden="true">
        <path d="M 160 110 H 281" fill="none" stroke="rgb(20, 58, 82)" stroke-width="2"></path>
        <path d="M 300 110 L 281 101.5 L 281 118.5 Z" fill="rgb(20, 58, 82)"></path>
      </svg>
      <div class="node"><span>Alpha</span></div>
      <div class="node"><span>Gamma</span></div>
    </section>
    <svg class="diagram" id="marker-arrows" viewBox="0 0 520 260">
      <defs>
        <marker id="fixed-stroke-marker" viewBox="0 -5 19 10" refX="0" refY="0" markerWidth="9.5" markerHeight="5" markerUnits="strokeWidth" orient="90">
          <path d="M 0 -5 L 19 0 L 0 5 Z" fill="rgb(20, 58, 82)"></path>
        </marker>
        <marker id="auto-user-marker" viewBox="-19 -5 19 10" refX="0" refY="0" markerWidth="19" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M 0 -5 L -19 0 L 0 5 Z" fill="rgb(20, 58, 82)"></path>
        </marker>
      </defs>
      <path d="M 100 80 L 100 141" fill="none" stroke="rgb(20, 58, 82)" stroke-width="2" marker-end="url(#fixed-stroke-marker)"></path>
      <path d="M 360 99 L 360 160" fill="none" stroke="rgb(20, 58, 82)" stroke-width="2" marker-start="url(#auto-user-marker)"></path>
      <rect x="40" y="20" width="120" height="60" fill="rgb(227, 233, 234)" stroke="rgb(20, 58, 82)" stroke-width="2"></rect>
      <text x="50" y="56" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="rgb(20, 58, 82)">Fixed start</text>
      <rect x="40" y="160" width="120" height="60" fill="rgb(227, 233, 234)" stroke="rgb(20, 58, 82)" stroke-width="2"></rect>
      <text x="50" y="196" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="rgb(20, 58, 82)">Fixed end</text>
      <rect x="300" y="20" width="120" height="60" fill="rgb(227, 233, 234)" stroke="rgb(20, 58, 82)" stroke-width="2"></rect>
      <text x="310" y="56" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="rgb(20, 58, 82)">Auto start</text>
      <rect x="300" y="160" width="120" height="60" fill="rgb(227, 233, 234)" stroke="rgb(20, 58, 82)" stroke-width="2"></rect>
      <text x="310" y="196" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="rgb(20, 58, 82)">Auto end</text>
    </svg>
    <svg class="diagram" id="auto-start-reverse-markers" viewBox="0 0 520 260">
      <defs>
        <marker id="auto-start-reverse-marker" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path data-cdl-role="edge-arrowhead" d="M 0 0 L 10 5 L 0 10 z" fill="rgb(20, 58, 82)"></path>
        </marker>
      </defs>
      <path data-cdl-role="edge-line" d="M 160 50 L 299 50" fill="none" stroke="rgb(20, 58, 82)" stroke-width="2.5" marker-end="url(#auto-start-reverse-marker)"></path>
      <path data-cdl-role="edge-line" d="M 161 190 L 300 190" fill="none" stroke="rgb(20, 58, 82)" stroke-width="2.5" marker-start="url(#auto-start-reverse-marker)"></path>
      <rect x="40" y="20" width="120" height="60" fill="rgb(227, 233, 234)" stroke="rgb(20, 58, 82)" stroke-width="2"></rect>
      <text x="50" y="56" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="rgb(20, 58, 82)">End source</text>
      <rect x="300" y="20" width="120" height="60" fill="rgb(227, 233, 234)" stroke="rgb(20, 58, 82)" stroke-width="2"></rect>
      <text x="310" y="56" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="rgb(20, 58, 82)">End target</text>
      <rect x="40" y="160" width="120" height="60" fill="rgb(227, 233, 234)" stroke="rgb(20, 58, 82)" stroke-width="2"></rect>
      <text x="50" y="196" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="rgb(20, 58, 82)">Start source</text>
      <rect x="300" y="160" width="120" height="60" fill="rgb(227, 233, 234)" stroke="rgb(20, 58, 82)" stroke-width="2"></rect>
      <text x="310" y="196" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="rgb(20, 58, 82)">Start target</text>
    </svg>
    <svg class="diagram" id="curved-marker-arrow" viewBox="0 0 520 260">
      <defs>
        <marker id="curved-down-marker" viewBox="0 0 20 19" refX="10" refY="0" markerWidth="20" markerHeight="19" markerUnits="userSpaceOnUse" orient="0">
          <path d="M 0 0 L 10 19 L 20 0 Z" fill="rgb(20, 58, 82)"></path>
        </marker>
      </defs>
      <path d="M 400 80 L 400 110 L 100 110 L 100 141" fill="none" stroke="rgb(20, 58, 82)" stroke-width="2" marker-end="url(#curved-down-marker)"></path>
      <rect x="340" y="20" width="140" height="60" fill="rgb(227, 233, 234)" stroke="rgb(20, 58, 82)" stroke-width="2"></rect>
      <text x="350" y="56" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="rgb(20, 58, 82)">Curved source</text>
      <rect x="40" y="160" width="120" height="60" fill="rgb(227, 233, 234)" stroke="rgb(20, 58, 82)" stroke-width="2"></rect>
      <text x="50" y="196" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="rgb(20, 58, 82)">Curved target</text>
    </svg>
    <svg class="diagram" id="layered-shared-edges" viewBox="0 0 520 260">
      <g data-cdl-edge data-cdl-from="Arrival" data-cdl-to="Sort">
        <path class="layered-edge main" d="M 120 130 L 180 130"></path>
        <path class="layered-edge outline" d="M 120 130 L 180 130"></path>
      </g>
      <g data-cdl-edge data-cdl-from="Sort" data-cdl-to="North">
        <path class="layered-edge main" d="M 280 130 L 310 130 Q 325 130 325 115 L 325 65 Q 325 50 340 50 L 400 50"></path>
        <path class="layered-edge outline" d="M 280 130 L 310 130 Q 325 130 325 115 L 325 65 Q 325 50 340 50 L 400 50"></path>
      </g>
      <g data-cdl-edge data-cdl-from="Sort" data-cdl-to="Center">
        <path class="layered-edge main" d="M 280 130 L 400 130"></path>
        <path class="layered-edge outline" d="M 280 130 L 400 130"></path>
      </g>
      <g data-cdl-edge data-cdl-from="Sort" data-cdl-to="South">
        <path class="layered-edge main" d="M 280 130 L 310 130 Q 325 130 325 145 L 325 195 Q 325 210 340 210 L 400 210"></path>
        <path class="layered-edge outline" d="M 280 130 L 310 130 Q 325 130 325 145 L 325 195 Q 325 210 340 210 L 400 210"></path>
      </g>
      <g data-cdl-node><rect x="20" y="100" width="100" height="60" fill="rgb(227, 233, 234)"></rect><text x="30" y="136">Arrival</text></g>
      <g data-cdl-node><rect x="180" y="100" width="100" height="60" fill="rgb(227, 233, 234)"></rect><text x="190" y="136">Sort</text></g>
      <g data-cdl-node><rect x="400" y="20" width="100" height="60" fill="rgb(227, 233, 234)"></rect><text x="410" y="56">North</text></g>
      <g data-cdl-node><rect x="400" y="100" width="100" height="60" fill="rgb(227, 233, 234)"></rect><text x="410" y="136">Center</text></g>
      <g data-cdl-node><rect x="400" y="180" width="100" height="60" fill="rgb(227, 233, 234)"></rect><text x="410" y="216">South</text></g>
    </svg>
    <svg class="font-sample" id="zero-size-expected" viewBox="0 0 260 80">
      <text x="32" y="52" font-family="Arial, sans-serif" font-size="16" fill="rgb(20, 40, 60)">Zero box</text>
    </svg>
    <svg class="font-sample" id="zero-size-actual" viewBox="0 0 260 80">
      <rect x="32" y="12" width="0" height="40" fill="rgb(120, 80, 40)"></rect>
      <rect x="128" y="12" width="40" height="0" fill="rgb(120, 80, 40)"></rect>
      <text x="32" y="52" font-family="Arial, sans-serif" font-size="16" fill="rgb(20, 40, 60)">Zero box</text>
    </svg>
    <svg class="font-sample" id="unlabeled-area-expected" viewBox="0 0 260 80">
      <rect x="10" y="10" width="100" height="40" fill="rgb(224, 235, 244)" stroke="rgb(32, 64, 96)" stroke-width="2"></rect>
      <text x="22" y="36" font-family="Arial, sans-serif" font-size="16" fill="rgb(20, 40, 60)">Area scale</text>
      <rect x="150" y="10" width="20" height="20" fill="rgb(120, 80, 40)"></rect>
    </svg>
    <svg class="font-sample" id="unlabeled-area-actual" viewBox="0 0 260 80">
      <g transform="scale(0.5)">
        <rect x="10" y="10" width="100" height="40" fill="rgb(224, 235, 244)" stroke="rgb(32, 64, 96)" stroke-width="2"></rect>
        <text x="22" y="36" font-family="Arial, sans-serif" font-size="16" fill="rgb(20, 40, 60)">Area scale</text>
        <rect x="150" y="10" width="20" height="20" fill="rgb(120, 80, 40)"></rect>
        <rect x="190" y="10" width="19" height="20" fill="rgb(120, 80, 40)"></rect>
      </g>
    </svg>
  </main>
  <script>
    const template = document.querySelector("#contents");
    for (const diagram of document.querySelectorAll(".templated")) {
      diagram.append(template.content.cloneNode(true));
    }
  </script>
</body>
</html>
