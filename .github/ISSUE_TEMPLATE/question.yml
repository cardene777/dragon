name: Question
description: Ask how to use dragon or how it behaves
title: "[q] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Questions are welcome.
        Ask about anything the README and the examples (`packages/dragon/examples/`) do not answer.
        You can write in English or Japanese.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you want to know
      placeholder: "When I leave out --width, does the export show the whole diagram or follow the current part?"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What you tried
      description: Code you tried, docs you read, and what you want to use it for
      render: tsx

  - type: input
    id: version
    attributes:
      label: dragon version
      description: Paste the output of `npm ls @cardenelabs/dragon`, if you have it installed

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I looked in the README, the docs, and the examples
          required: true
        - label: I searched the existing issues
          required: true
