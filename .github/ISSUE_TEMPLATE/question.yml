name: Question
description: 使い方 / 仕様の質問
title: "[q] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        質問歓迎です。
        README と例 (`packages/dragon/examples/`) で見当たらない動作仕様は遠慮なくどうぞ。

  - type: textarea
    id: question
    attributes:
      label: 質問内容
      description: 何を知りたいか
      placeholder: "--width を渡さない時、全体を止める見せ方と寄って追う見せ方のどちらになる？"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 試したこと / context
      description: 既に試した code / 読んだ docs / 想定 use case
      render: tsx

  - type: input
    id: version
    attributes:
      label: dragon version
      placeholder: "0.29.0"

  - type: checkboxes
    id: checks
    attributes:
      label: 確認
      options:
        - label: README / docs / 例で探した
          required: true
        - label: 既存 issue を検索した
          required: true
