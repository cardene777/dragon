name: Bug report
description: dragon の動作が想定と違うときに使う template
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        bug 報告ありがとうございます。
        再現手順を明確にすると修正が早く進みます。

  - type: input
    id: version
    attributes:
      label: dragon version
      description: 使っている `@cardenelabs/dragon` の version (package.json 参照)
      placeholder: "0.29.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 環境
      description: OS / node / package manager
      placeholder: "macOS 14, node 22, pnpm 10"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 何が起きたか
      description: 観測した現象を 1-3 文で
      placeholder: "寄って追う見せ方で書き出した mp4 で、全体図の今見ている所の枠が動かない"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      description: あるべき挙動
      placeholder: "段が進むたびに、全体図の枠が今の段の所へ動く"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 最小再現の記法 (`.dragon`) か原本の JSON と、打った命令
      render: text
      placeholder: |
        時系列図 最小再現

        A = 送る側
        B = 受ける側

        # 送る
        > A が B に送る。
        A -> B : msg

        dragon export small.dragon --width 480 --format mp4
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: error / log
      description: console error / stack trace があれば
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 確認
      options:
        - label: 最新 version で再現する
          required: true
        - label: 既存 issue を検索した
          required: true
