name: Bug report
description: dragon does not work the way you expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.
        A small diagram that shows the problem helps it get fixed sooner.
        You can write in English or Japanese.

  - type: input
    id: version
    attributes:
      label: dragon version
      description: The version of `@cardenelabs/dragon` you use. Paste the output of `npm ls @cardenelabs/dragon`.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, package manager, and browser if the problem is on a page
      placeholder: "macOS 15, Node.js 22, pnpm 10, Chrome"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, in one to three sentences
      placeholder: "In an MP4 exported with --width 480, the frame on the overview that marks the current part does not move."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead
      placeholder: "The frame on the overview moves to the current step each time a step plays."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Diagram that shows the problem
      description: The smallest dragon notation (`.dragon`) or source JSON that shows the problem
      render: text
      placeholder: |
        sequence Smallest example

        box sender as Sender
        box receiver as Receiver

        step Send
          say The sender sends a message.
          sender -> receiver: message
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command or code
      description: The command you ran, or the code that puts the diagram on a page
      render: shell
      placeholder: "dragon export small.dragon --width 480 --format mp4"

  - type: textarea
    id: logs
    attributes:
      label: Errors and logs
      description: Error messages, console output, or a stack trace, if any
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The problem happens with the latest version on npm
          required: true
        - label: I searched the existing issues
          required: true
