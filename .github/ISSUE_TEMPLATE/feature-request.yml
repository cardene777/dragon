name: Feature request
description: 新機能 / 改善提案
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        feature 提案ありがとうございます。
        ユースケース + 既存回避策との比較があると判断が早く進みます。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
      description: なぜこの feature が必要か (シナリオ + 痛点)
      placeholder: "時系列図で、同じ段の中の 2 本の線を同時に走らせたいが、 今は 1 本ずつ順に走る"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する解
      description: 書きたい記法のイメージ / 動作仕様 / 代替案との比較
      render: text
      placeholder: |
        // こう書けると嬉しい、という記法のイメージ
        # 両方へ送る
        > アプリが API と記録へ同時に送る。
        アプリ -> API : 登録
        アプリ -> 記録 : 登録 [同時]
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案 / 既存回避策
      description: 「今はこう書いている」 / 「mermaid ではこう」 等

  - type: dropdown
    id: scope
    attributes:
      label: 影響範囲
      multiple: true
      options:
        - "@cardenelabs/dragon (原本の JSON / 記法 / 描画)"
        - dragon 記法そのもの (書ける欄を増やす)
        - 書き出し (dragon export の mp4 / GIF / HTML / PNG)
        - apps/playground-spa (公開する頁)
        - docs / README
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 確認
      options:
        - label: 既存 issue / discussion を検索した
          required: true
        - label: README / docs を読んで既存 API で実現できないか確認した
          required: true
