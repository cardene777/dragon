name: Feature request
description: Suggest a new feature or an improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature.
        Describing what you want to draw and how you work around it today helps decide sooner.
        You can write in English or Japanese.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What you want to do, and what gets in the way today
      placeholder: "In a sequence diagram I want two arrows in the same step to run at the same time, but today they run one after the other."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like to write it, how it should behave, and how it compares with other options
      placeholder: "A way to mark an arrow so it starts together with the arrow above it."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: How you write it today, or how another tool handles it

  - type: dropdown
    id: scope
    attributes:
      label: Area
      multiple: true
      options:
        - "@cardenelabs/dragon (source JSON, notation, renderer)"
        - The dragon notation itself (new fields or lines)
        - Export (MP4, GIF, HTML, and PNG from dragon export)
        - The catalog site (apps/playground-spa)
        - Docs and README
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and discussions
          required: true
        - label: I read the README and docs and found no existing way to do this
          required: true
