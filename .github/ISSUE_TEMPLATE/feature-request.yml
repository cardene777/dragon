name: Feature request
description: 新機能 / 改善提案
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        feature 提案ありがとうございます。
        ユースケース + 既存回避策との比較があると判断が早く進みます。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
      description: なぜこの feature が必要か (シナリオ + 痛点)
      placeholder: "ER 図で composite key を表現したいが、 現状 row 列挙のみで PK の組合せが表現できない"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する解
      description: API イメージ / 動作仕様 / 代替案との比較
      render: tsx
      placeholder: |
        er({ id, topic })
          .entity({ id: "user_role", title: "UserRole",
            rows: ["userId: PK+FK", "roleId: PK+FK"] })
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案 / 既存回避策
      description: 「今はこう書いている」 / 「mermaid ではこう」 等

  - type: dropdown
    id: scope
    attributes:
      label: 影響範囲
      multiple: true
      options:
        - "@chainome/cdl (core lib)"
        - "@chainome/anim (runtime)"
        - apps/playground (editor / catalog)
        - docs
        - text DSL parser
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 確認
      options:
        - label: 既存 issue / discussion を検索した
          required: true
        - label: README / docs を読んで既存 API で実現できないか確認した
          required: true
