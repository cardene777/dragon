<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拠点の仕分け</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 840px;
      height: 520px;
      margin: 0;
      overflow: hidden;
      background: #fdfbf5;
    }

    .fig {
      position: relative;
      width: 840px;
      height: 520px;
      overflow: hidden;
      background: #fdfbf5;
      color: #2a231d;
      font-family: Inter, -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .fig > svg {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 840px;
      height: 520px;
      overflow: visible;
      pointer-events: none;
    }

    .node {
      position: absolute;
      z-index: 2;
    }

    .meter {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border: 1.5px solid #5e5446;
      border-radius: 6px;
    }

    .fill {
      position: absolute;
      background: var(--fill);
    }

    .fill-up {
      right: 0;
      bottom: 0;
      left: 0;
      height: var(--amount);
    }

    .fill-right {
      top: 0;
      bottom: 0;
      left: 0;
      width: var(--amount);
    }

    .box-name,
    .box-value,
    .box-count {
      position: absolute;
      white-space: nowrap;
    }

    .box-name {
      bottom: calc(100% + 4px);
      left: 0;
      color: #2a231d;
      font: 600 13px/1 Inter, -apple-system, system-ui, sans-serif;
    }

    .box-value {
      right: 0;
      bottom: calc(100% + 4px);
      color: #6a5f50;
      font: 400 11px/1 monospace;
    }

    .box-count {
      top: calc(100% + 7px);
      left: 50%;
      color: #6a5f50;
      font: 400 12px/1 Inter, -apple-system, system-ui, sans-serif;
      transform: translateX(-50%);
    }

    .wire {
      fill: none;
      stroke: #4f4339;
      stroke-width: 7;
      stroke-linecap: butt;
      stroke-linejoin: round;
    }

    .arrow {
      fill: #4f4339;
    }

    .tag rect {
      fill: #fdfbf5;
      stroke: #d8cdb8;
      stroke-width: 1;
    }

    .tag text {
      fill: #2a231d;
      font: 400 16px/1 Inter, -apple-system, system-ui, sans-serif;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
</head>
<body>
  <div class="fig" role="img" aria-label="入荷した1200個の荷物を仕分けし、北地区、中央地区、南地区の3台の配達車へ積み込んだ図">
    <svg viewBox="0 0 840 520" aria-hidden="true">
      <path class="wire" d="M 160 260 H 281" />
      <path class="arrow" d="M 300 260 L 281 251.5 L 281 268.5 Z" />

      <path class="wire" d="M 420 220 H 456 Q 470 220 470 206 V 104 Q 470 90 484 90 H 581" />
      <path class="arrow" d="M 600 90 L 581 81.5 L 581 98.5 Z" />

      <path class="wire" d="M 420 260 H 581" />
      <path class="arrow" d="M 600 260 L 581 251.5 L 581 268.5 Z" />

      <path class="wire" d="M 420 300 H 456 Q 470 300 470 314 V 416 Q 470 430 484 430 H 581" />
      <path class="arrow" d="M 600 430 L 581 421.5 L 581 438.5 Z" />

      <g class="tag">
        <rect x="201" y="213" width="58" height="30" rx="10" />
        <text x="230" y="228">流す</text>
      </g>
      <g class="tag">
        <rect x="506" y="47" width="58" height="30" rx="10" />
        <text x="535" y="62">北へ</text>
      </g>
      <g class="tag">
        <rect x="499" y="217" width="72" height="30" rx="10" />
        <text x="535" y="232">中央へ</text>
      </g>
      <g class="tag">
        <rect x="506" y="387" width="58" height="30" rx="10" />
        <text x="535" y="402">南へ</text>
      </g>
    </svg>

    <div class="node" style="left:40px;top:160px;width:120px;height:200px;--fill:#4e9dc4;--amount:100%">
      <span class="box-name">入荷</span>
      <span class="box-value">1200 / 1200</span>
      <div class="meter"><div class="fill fill-up"></div></div>
      <span class="box-count">1200 個</span>
    </div>

    <div class="node" style="left:300px;top:160px;width:120px;height:200px;--fill:#4e9dc4;--amount:100%">
      <span class="box-name">仕分け</span>
      <span class="box-value">1200 / 1200</span>
      <div class="meter"><div class="fill fill-up"></div></div>
      <span class="box-count">1200 個</span>
    </div>

    <div class="node" style="left:600px;top:40px;width:200px;height:100px;--fill:#f97316;--amount:100%">
      <span class="box-name">北地区の車</span>
      <span class="box-value">500 / 500</span>
      <div class="meter"><div class="fill fill-right"></div></div>
      <span class="box-count">500 個</span>
    </div>

    <div class="node" style="left:600px;top:210px;width:200px;height:100px;--fill:#f97316;--amount:80%">
      <span class="box-name">中央地区の車</span>
      <span class="box-value">400 / 500</span>
      <div class="meter"><div class="fill fill-right"></div></div>
      <span class="box-count">400 個</span>
    </div>

    <div class="node" style="left:600px;top:380px;width:200px;height:100px;--fill:#f97316;--amount:60%">
      <span class="box-name">南地区の車</span>
      <span class="box-value">300 / 500</span>
      <div class="meter"><div class="fill fill-right"></div></div>
      <span class="box-count">300 個</span>
    </div>
  </div>
</body>
</html>
