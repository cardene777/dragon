<style>*{margin:0;box-sizing:border-box}body{width:1800px;height:1100px;position:relative;overflow:hidden}

.fig{position:relative;width:1800px;height:1100px;overflow:hidden;transform-origin:top left;
     font-family:'Noto Sans JP',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.fig *{margin:0;box-sizing:border-box}
.fig .ent{position:absolute;border-radius:12px;overflow:hidden}
.fig .ti{font:700 29px/1.1 'Noto Sans JP',system-ui,sans-serif;color:#d3ddd6}
.fig .rows{display:flex;flex-direction:column}
.fig .row{height:46px;display:flex;align-items:center;padding:0 24px;gap:14px}
.fig .mk{width:9px;height:9px;flex:none}
.fig .nm{font:500 22px/1 'Noto Sans JP',system-ui,sans-serif;color:#d3ddd6;white-space:nowrap}
.fig .ty{font:400 19px/1 'JetBrains Mono',ui-monospace,monospace;color:#355542;margin-left:auto;white-space:nowrap}
.fig .void{padding:20px 24px 22px;font:400 19px/1 'JetBrains Mono',ui-monospace,monospace;color:#355542;letter-spacing:.05em}
.fig .foot{display:flex;justify-content:space-between;align-items:center}
.fig .fk{font:700 14px/1 'JetBrains Mono',ui-monospace,monospace;color:#8a9b90;letter-spacing:.16em}
.fig .fn{font:400 17px/1 'JetBrains Mono',ui-monospace,monospace;color:#355542}
.fig .well{margin:14px;padding:12px;border-radius:9px;display:flex;flex-direction:column;gap:12px}
.fig .nest{position:relative;left:auto;top:auto;width:auto;border-radius:8px}
.fig .nest .ti{font-size:22px}
.fig .nest .row{height:40px;padding:0 18px}
.fig .nest .nm{font-size:20px}
.fig .nest .ty{font-size:17px}
.fig .nest .foot{display:none}
.fig > svg{position:absolute;inset:0;width:1800px;height:1100px;pointer-events:none;overflow:visible}

  .fig{background-color:#050b07;
    background-image:radial-gradient(1400px 900px at 50% 40%, rgba(74,222,128,.06), transparent 70%),
      linear-gradient(rgba(74,222,128,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,222,128,.05) 1px, transparent 1px);
    background-size:auto, 44px 44px, 44px 44px}
  .fig .ent{background:linear-gradient(180deg, #0a150e, #070f0a);border-radius:6px;border:1px solid rgba(74,222,128,.3)}
  .fig .ent[data-w="太"]{border:1.5px solid #4ade80;box-shadow:0 0 0 1px rgba(74,222,128,.12), 0 0 26px rgba(74,222,128,.22)}
  .fig .head{padding:15px 22px 13px;border-bottom:1px solid rgba(74,222,128,.16)}
  .fig .ent[data-w="太"] .head{display:flex;align-items:center;gap:16px}
  .fig .ent[data-w="太"] .head::before{content:"";flex:none;width:52px;height:12px;
    background:radial-gradient(circle at 6px 6px, #ff5f57 5px, transparent 5.5px),
      radial-gradient(circle at 26px 6px, #febc2e 5px, transparent 5.5px),
      radial-gradient(circle at 46px 6px, #28c840 5px, transparent 5.5px)}
  .fig .ent[data-w="太"] .ti::after{content:"▋";margin-left:6px;font-weight:400;color:#4ade80}
  .fig .ti{color:#9ef0b4;text-shadow:0 0 10px rgba(74,222,128,.35)}
  .fig .rows{counter-reset:ln}
  .fig .row::before{counter-increment:ln;content:counter(ln);flex:none;width:16px;margin-right:-2px;text-align:right;
    font:400 15px/1 'JetBrains Mono','M PLUS 1 Code',ui-monospace,monospace;color:#3f5a49}
  .fig .rows .row + .row{border-top:1px solid rgba(74,222,128,.07)}
  .fig .nm{color:#d3ddd6}
  .fig .ty,.fig .fn{color:#7f9186}
  .fig .void{color:#5f7568}
  .fig .void::before{content:"// "}
  .fig .foot{padding:10px 22px;border-top:1px solid rgba(74,222,128,.12)}
  .fig .fk{color:#4ade80;letter-spacing:.18em}
  .fig .nest{background:#060d08;border:1px solid rgba(74,222,128,.22);border-radius:5px}
  .fig .nest .head{padding:10px 16px 8px}
  .fig .well{background:rgba(0,0,0,.18);border:1px dashed rgba(74,222,128,.2);border-radius:6px}
  .fig .ti,.fig .nm,.fig .ty,.fig .void,.fig .fk,.fig .fn,.fig .sub,.fig .kw{font-family:'JetBrains Mono','M PLUS 1 Code',ui-monospace,monospace}
  .fig .ti{font-weight:700;font-size:25px}
  .fig .mk{border-radius:2px;width:9px;height:9px}
.fig .actor{text-align:center}
.fig .actor .head{border-bottom:0}
.fig .actor .sub{font:400 19px/1 'JetBrains Mono','M PLUS 1 Code',ui-monospace,monospace;color:#8a9b90;margin-top:10px;letter-spacing:.04em}
.fig .panel{display:flex;flex-direction:column}
.fig .panel .plot{flex:1;min-height:0}
.fig .panel .split{flex:1;display:flex;min-height:0}
.fig .panel .split .rows{width:310px;align-self:center}
.fig .lab{position:absolute;left:60px;width:540px;height:44px;display:flex;align-items:center;gap:16px}
.fig .lab .nm{font-size:26px;color:#a6f0bd}
.fig .lab .kw{font:500 16px/1 'JetBrains Mono',ui-monospace,monospace;color:#7f9186;letter-spacing:.12em;margin-left:2px}
.fig .mass{position:absolute;transform-origin:50% 100%}
.fig .mass.band{transform-origin:50% 0}
.fig .sub{font:400 19px/1 'JetBrains Mono','M PLUS 1 Code',ui-monospace,monospace;color:#8a9b90;margin-top:10px;letter-spacing:.04em}
.fig .kw{font:500 16px/1 'JetBrains Mono',ui-monospace,monospace;color:#8a9b90;letter-spacing:.12em}
.fig .step .head,.fig .tn .head{text-align:center;border-bottom-color:transparent}
.fig .step .ti{font-size:26px}
.fig .card .head,.fig .pill .head{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom-color:transparent}
.fig .card .ti{font-size:25px}
.fig .stage .head .kw{display:block;margin-bottom:10px}
.fig .node .head{position:relative;padding-right:78px}
.fig .node .ico{position:absolute;right:22px;top:50%;margin-top:-20px}
.fig .zone{margin:0;padding:0;display:block;border:0}
.fig .zl{position:absolute;left:26px;top:20px;display:flex;align-items:baseline;gap:14px}
.fig .zl .nm{font-size:24px;font-weight:700;color:#a6f0bd}
.fig .zl .kw{color:#7f9186}
.fig .cls .head{text-align:center}
.fig .cls .head .kw{margin-bottom:9px;letter-spacing:.2em}
.fig .cls .ops{border-top:1.5px solid color-mix(in srgb, #d3ddd6 40%, transparent)}
.fig .panel.narrow .split .rows{width:190px}
.fig .mass.bar{transform-origin:0 50%}
.fig .mass.bar.mid{transform-origin:50% 50%}
.fig svg .tag-wrap{transform-box:fill-box;transform-origin:50% 50%}

.fig svg text{font-family:'JetBrains Mono','M PLUS 1 Code',ui-monospace,monospace} .fig .lab .nm,.fig .zl .nm{font-family:'JetBrains Mono','M PLUS 1 Code',ui-monospace,monospace} .fig .zl .nm{color:#4ade80} .fig .zone{border:1px dashed rgba(74,222,128,.3);background:rgba(74,222,128,.025)} .fig .tn[data-w="太"] .head,.fig .step[data-w="太"] .head{justify-content:center}
.fig .node .ico{width:46px;height:46px;margin-top:-23px;padding:7px;border:1px solid rgba(74,222,128,.4);border-radius:7px} .fig .node .ico path{stroke:#4ade80}




  .fig .mass{background:var(--col);border-radius:3px 3px 0 0}
