<style>*{margin:0;box-sizing:border-box}body{width:1800px;height:1100px;position:relative;overflow:hidden}

.fig{position:relative;width:1800px;height:1100px;overflow:hidden;transform-origin:top left;
     font-family:'Noto Sans JP',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.fig *{margin:0;box-sizing:border-box}
.fig .ent{position:absolute;border-radius:12px;overflow:hidden}
.fig .ti{font:700 29px/1.1 'Noto Sans JP',system-ui,sans-serif;color:#f3eefe}
.fig .rows{display:flex;flex-direction:column}
.fig .row{height:46px;display:flex;align-items:center;padding:0 24px;gap:14px}
.fig .mk{width:9px;height:9px;flex:none}
.fig .nm{font:500 22px/1 'Noto Sans JP',system-ui,sans-serif;color:#f3eefe;white-space:nowrap}
.fig .ty{font:400 19px/1 'JetBrains Mono',ui-monospace,monospace;color:#8f86b3;margin-left:auto;white-space:nowrap}
.fig .void{padding:20px 24px 22px;font:400 19px/1 'JetBrains Mono',ui-monospace,monospace;color:#8f86b3;letter-spacing:.05em}
.fig .foot{display:flex;justify-content:space-between;align-items:center}
.fig .fk{font:700 14px/1 'JetBrains Mono',ui-monospace,monospace;color:#c4bce0;letter-spacing:.16em}
.fig .fn{font:400 17px/1 'JetBrains Mono',ui-monospace,monospace;color:#8f86b3}
.fig .well{margin:14px;padding:12px;border-radius:9px;display:flex;flex-direction:column;gap:12px}
.fig .nest{position:relative;left:auto;top:auto;width:auto;border-radius:8px}
.fig .nest .ti{font-size:22px}
.fig .nest .row{height:40px;padding:0 18px}
.fig .nest .nm{font-size:20px}
.fig .nest .ty{font-size:17px}
.fig .nest .foot{display:none}
.fig > svg{position:absolute;inset:0;width:1800px;height:1100px;pointer-events:none;overflow:visible}

  .fig{background:
    radial-gradient(820px 560px at 18% 12%, rgba(255,46,151,.14), transparent 64%),
    radial-gradient(760px 540px at 84% 80%, rgba(0,229,255,.12), transparent 62%),
    radial-gradient(1300px 900px at 50% 45%, #0e0b1a, #040308)}
  .fig .ent{--n:#ff2e97;background:rgba(10,8,18,.94);border-radius:16px;
    border:2px solid color-mix(in srgb,var(--n) 35%,white);
    box-shadow:0 0 2px 1px var(--n), 0 0 10px 2px color-mix(in srgb,var(--n) 55%,transparent), 0 0 24px 4px color-mix(in srgb,var(--n) 22%,transparent),
      inset 0 0 2px 1px var(--n), inset 0 0 10px color-mix(in srgb,var(--n) 20%,transparent)}
  .fig .ent[data-role="段階"]{--n:#ffd000}
  .fig .ent[data-role="抱"],.fig .ent[data-role="実体"],.fig .actor,.fig .panel{--n:#00e5ff}
  .fig .ent.nest{--n:#b26bff;border-width:2px;
    box-shadow:0 0 2px 1px var(--n), 0 0 10px 2px color-mix(in srgb,var(--n) 60%,transparent), inset 0 0 12px 1px color-mix(in srgb,var(--n) 32%,transparent)}
  .fig .head{padding:16px 24px 14px;border-bottom:1px solid color-mix(in srgb,var(--n) 32%,transparent)}
  .fig .foot{padding:10px 24px;border-top:1px solid color-mix(in srgb,var(--n) 24%,transparent)}
  .fig .ti{font-family:'M PLUS Rounded 1c','Noto Sans JP',sans-serif;font-weight:800;color:#ffffff;
    text-shadow:0 0 5px var(--n), 0 0 12px color-mix(in srgb,var(--n) 60%,transparent)}
  .fig .nm{color:#f3eefe}
  .fig .ty{color:#bdb5dc}
  .fig .well{background:transparent;border-radius:12px}
  .fig .mk{border-radius:50%;box-shadow:0 0 7px 1px color-mix(in srgb,var(--n) 75%,transparent)}
.fig .actor{text-align:center}
.fig .actor .head{border-bottom:0}
.fig .actor .sub{font:400 19px/1 'Noto Sans JP',system-ui,sans-serif;color:#c4bce0;margin-top:10px;letter-spacing:.04em}
.fig .panel{display:flex;flex-direction:column}
.fig .panel .plot{flex:1;min-height:0}
.fig .panel .split{flex:1;display:flex;min-height:0}
.fig .panel .split .rows{width:310px;align-self:center}
.fig .lab{position:absolute;left:60px;width:540px;height:44px;display:flex;align-items:center;gap:16px}
.fig .lab .nm{font-size:26px;color:#f3eefe}
.fig .lab .kw{font:500 16px/1 'JetBrains Mono',ui-monospace,monospace;color:#c4bce0;letter-spacing:.12em;margin-left:2px}
.fig .mass{position:absolute;transform-origin:50% 100%}
.fig .mass.band{transform-origin:50% 0}
.fig .sub{font:400 19px/1 'Noto Sans JP',system-ui,sans-serif;color:#c4bce0;margin-top:10px;letter-spacing:.04em}
.fig .kw{font:500 16px/1 'JetBrains Mono',ui-monospace,monospace;color:#c4bce0;letter-spacing:.12em}
.fig .step .head,.fig .tn .head{text-align:center;border-bottom-color:transparent}
.fig .step .ti{font-size:26px}
.fig .card .head,.fig .pill .head{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom-color:transparent}
.fig .card .ti{font-size:25px}
.fig .stage .head .kw{display:block;margin-bottom:10px}
.fig .node .head{position:relative;padding-right:78px}
.fig .node .ico{position:absolute;right:22px;top:50%;margin-top:-20px}
.fig .zone{margin:0;padding:0;display:block;border:0}
.fig .zl{position:absolute;left:26px;top:20px;display:flex;align-items:baseline;gap:14px}
.fig .zl .nm{font-size:24px;font-weight:700;color:#f3eefe}
.fig .zl .kw{color:#c4bce0}
.fig .cls .head{text-align:center}
.fig .cls .head .kw{margin-bottom:9px;letter-spacing:.2em}
.fig .cls .ops{border-top:1.5px solid color-mix(in srgb, #f3eefe 40%, transparent)}
.fig .panel.narrow .split .rows{width:190px}
.fig .mass.bar{transform-origin:0 50%}
.fig .mass.bar.mid{transform-origin:50% 50%}
.fig svg .tag-wrap{transform-box:fill-box;transform-origin:50% 50%}




.fig svg .num{stroke:none} .fig .zl .nm,.fig .lab .nm{font-family:'M PLUS Rounded 1c','Noto Sans JP',sans-serif;font-weight:800;text-shadow:0 0 5px rgba(0,229,255,.7),0 0 12px rgba(0,229,255,.35)}
