<style>*{margin:0;box-sizing:border-box}body{width:1800px;height:1100px;position:relative;overflow:hidden}

.fig{position:relative;width:1800px;height:1100px;overflow:hidden;transform-origin:top left;
     font-family:'Noto Sans JP',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.fig *{margin:0;box-sizing:border-box}
.fig .ent{position:absolute;border-radius:12px;overflow:hidden}
.fig .ti{font:700 29px/1.1 'Noto Sans JP',system-ui,sans-serif;color:#463e33}
.fig .rows{display:flex;flex-direction:column}
.fig .row{height:46px;display:flex;align-items:center;padding:0 24px;gap:14px}
.fig .mk{width:9px;height:9px;flex:none}
.fig .nm{font:500 22px/1 'Noto Sans JP',system-ui,sans-serif;color:#463e33;white-space:nowrap}
.fig .ty{font:400 19px/1 'JetBrains Mono',ui-monospace,monospace;color:#a99e8e;margin-left:auto;white-space:nowrap}
.fig .void{padding:20px 24px 22px;font:400 19px/1 'JetBrains Mono',ui-monospace,monospace;color:#a99e8e;letter-spacing:.05em}
.fig .foot{display:flex;justify-content:space-between;align-items:center}
.fig .fk{font:700 14px/1 'JetBrains Mono',ui-monospace,monospace;color:#7a7062;letter-spacing:.16em}
.fig .fn{font:400 17px/1 'JetBrains Mono',ui-monospace,monospace;color:#a99e8e}
.fig .well{margin:14px;padding:12px;border-radius:9px;display:flex;flex-direction:column;gap:12px}
.fig .nest{position:relative;left:auto;top:auto;width:auto;border-radius:8px}
.fig .nest .ti{font-size:22px}
.fig .nest .row{height:40px;padding:0 18px}
.fig .nest .nm{font-size:20px}
.fig .nest .ty{font-size:17px}
.fig .nest .foot{display:none}
.fig > svg{position:absolute;inset:0;width:1800px;height:1100px;pointer-events:none;overflow:visible}

  .fig{background:#e8e3da}
  .fig .ent{background:#e8e3da;border-radius:22px;
    box-shadow:7px 7px 15px rgba(160,144,120,.5), -7px -7px 15px rgba(255,255,255,.92)}
  .fig .ent[data-w="太"]{background:linear-gradient(145deg, #f3efe8, #d9d2c6);
    box-shadow:12px 12px 24px rgba(160,144,120,.55), -12px -12px 24px rgba(255,255,255,.95)}
  .fig .ent[data-w="太"] .ti{color:#c4573c}
  .fig .head{padding:20px 26px 12px}
  .fig .ti{font-weight:700;letter-spacing:.01em}
  .fig .ent:not(.panel):not(.nest) > .rows,.fig .void{margin:2px 16px 4px;padding:6px 0;border-radius:15px;
    box-shadow:inset 4px 4px 8px rgba(160,144,120,.42), inset -4px -4px 8px rgba(255,255,255,.88)}
  .fig .void{padding:18px}
  .fig .row{padding:0 18px}
  .fig .foot{padding:12px 26px 16px}
  .fig .panel .plot{margin:4px 18px 8px;border-radius:18px;
    box-shadow:inset 5px 5px 11px rgba(160,144,120,.42), inset -5px -5px 11px rgba(255,255,255,.88)}
  .fig .well{background:transparent;border-radius:18px;margin:6px 16px;padding:16px;
    box-shadow:inset 5px 5px 11px rgba(160,144,120,.45), inset -5px -5px 11px rgba(255,255,255,.88)}
  .fig .nest{background:#e8e3da;border-radius:14px;
    box-shadow:4px 4px 9px rgba(160,144,120,.45), -4px -4px 9px rgba(255,255,255,.9)}
  .fig .nest .head{padding:12px 18px 8px}
  .fig .mk{border-radius:50%;width:10px;height:10px}
.fig .actor{text-align:center}
.fig .actor .head{border-bottom:0}
.fig .actor .sub{font:400 19px/1 'Noto Sans JP',system-ui,sans-serif;color:#7a7062;margin-top:10px;letter-spacing:.04em}
.fig .panel{display:flex;flex-direction:column}
.fig .panel .plot{flex:1;min-height:0}
.fig .panel .split{flex:1;display:flex;min-height:0}
.fig .panel .split .rows{width:310px;align-self:center}
.fig .lab{position:absolute;left:60px;width:540px;height:44px;display:flex;align-items:center;gap:16px}
.fig .lab .nm{font-size:26px;color:#463e33}
.fig .lab .kw{font:500 16px/1 'JetBrains Mono',ui-monospace,monospace;color:#7a7062;letter-spacing:.12em;margin-left:2px}
.fig .mass{position:absolute;transform-origin:50% 100%}
.fig .mass.band{transform-origin:50% 0}
.fig .sub{font:400 19px/1 'Noto Sans JP',system-ui,sans-serif;color:#7a7062;margin-top:10px;letter-spacing:.04em}
.fig .kw{font:500 16px/1 'JetBrains Mono',ui-monospace,monospace;color:#7a7062;letter-spacing:.12em}
.fig .step .head,.fig .tn .head{text-align:center;border-bottom-color:transparent}
.fig .step .ti{font-size:26px}
.fig .card .head,.fig .pill .head{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom-color:transparent}
.fig .card .ti{font-size:25px}
.fig .stage .head .kw{display:block;margin-bottom:10px}
.fig .node .head{position:relative;padding-right:78px}
.fig .node .ico{position:absolute;right:22px;top:50%;margin-top:-20px}
.fig .zone{margin:0;padding:0;display:block;border:0}
.fig .zl{position:absolute;left:26px;top:20px;display:flex;align-items:baseline;gap:14px}
.fig .zl .nm{font-size:24px;font-weight:700;color:#463e33}
.fig .zl .kw{color:#7a7062}
.fig .cls .head{text-align:center}
.fig .cls .head .kw{margin-bottom:9px;letter-spacing:.2em}
.fig .cls .ops{border-top:1.5px solid color-mix(in srgb, #463e33 40%, transparent)}
.fig .panel.narrow .split .rows{width:190px}
.fig .mass.bar{transform-origin:0 50%}
.fig .mass.bar.mid{transform-origin:50% 50%}
.fig svg .tag-wrap{transform-box:fill-box;transform-origin:50% 50%}






  .fig .mass{background:linear-gradient(145deg,color-mix(in srgb,var(--col) 78%,white),var(--col));border-radius:12px 12px 5px 5px;

  .fig .mass.bar{border-radius:5px 12px 12px 5px}
  .fig .mass.bar.mid,.fig .mass.bar.seg{border-radius:10px}
  .fig .mass.band{background:#e8e3da;border-radius:12px;
