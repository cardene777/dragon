<style>*{margin:0;box-sizing:border-box}body{width:1800px;height:1100px;position:relative;overflow:hidden}

.fig{position:relative;width:1800px;height:1100px;overflow:hidden;transform-origin:top left;

.fig *{margin:0;box-sizing:border-box}
.fig .ent{position:absolute;border-radius:12px;overflow:hidden}
.fig .ti{font:700 29px/1.1 'Noto Sans JP',system-ui,sans-serif;color:#2b2620}
.fig .rows{display:flex;flex-direction:column}
.fig .row{height:46px;display:flex;align-items:center;padding:0 24px;gap:14px}
.fig .mk{width:9px;height:9px;flex:none}
.fig .nm{font:500 22px/1 'Noto Sans JP',system-ui,sans-serif;color:#2b2620;white-space:nowrap}
.fig .ty{font:400 19px/1 'JetBrains Mono',ui-monospace,monospace;color:#9a9080;margin-left:auto;white-space:nowrap}
.fig .void{padding:20px 24px 22px;font:400 19px/1 'JetBrains Mono',ui-monospace,monospace;color:#9a9080;letter-spacing:.05em}
.fig .foot{display:flex;justify-content:space-between;align-items:center}
.fig .fk{font:700 14px/1 'JetBrains Mono',ui-monospace,monospace;color:#6d6456;letter-spacing:.16em}
.fig .fn{font:400 17px/1 'JetBrains Mono',ui-monospace,monospace;color:#9a9080}
.fig .well{margin:14px;padding:12px;border-radius:9px;display:flex;flex-direction:column;gap:12px}
.fig .nest{position:relative;left:auto;top:auto;width:auto;border-radius:8px}
.fig .nest .ti{font-size:22px}
.fig .nest .row{height:40px;padding:0 18px}
.fig .nest .nm{font-size:20px}
.fig .nest .ty{font-size:17px}
.fig .nest .foot{display:none}
.fig > svg{position:absolute;inset:0;width:1800px;height:1100px;pointer-events:none;overflow:visible}

  .fig{background:#f7f1e3}
  .fig .ent{background:#fffdf7;box-shadow:0 0 0 2px #2b2620 inset, 3px 4px 0 -1px rgba(43,38,32,.16);

  .fig .rows .row + .row{border-top:1.5px dotted rgba(43,38,32,.4)}
  .fig .foot{padding:10px 24px;border-top:2px solid #2b2620}
  .fig .nest{background:#fffdf7;box-shadow:0 0 0 2px #2b2620 inset;border-radius:13px 9px 15px 10px}
  .fig .nest .head{padding:11px 18px 9px;border-bottom:1.5px solid #2b2620}
  .fig .well{background:transparent;box-shadow:0 0 0 1.5px rgba(43,38,32,.3) inset;border-radius:12px 16px 11px 18px}
  .fig .ti{font-weight:800}
  .fig .mk{border-radius:50% 40% 55% 45%}
.fig .actor{text-align:center}
.fig .actor .head{border-bottom:0}
.fig .actor .sub{font:400 19px/1 'Noto Sans JP',system-ui,sans-serif;color:#6d6456;margin-top:10px;letter-spacing:.04em}
.fig .panel{display:flex;flex-direction:column}
.fig .panel .plot{flex:1;min-height:0}
.fig .panel .split{flex:1;display:flex;min-height:0}
.fig .panel .split .rows{width:310px;align-self:center}
.fig .lab{position:absolute;left:60px;width:540px;height:44px;display:flex;align-items:center;gap:16px}
.fig .lab .nm{font-size:26px;color:#2b2620}
.fig .lab .kw{font:500 16px/1 'JetBrains Mono',ui-monospace,monospace;color:#6d6456;letter-spacing:.12em;margin-left:2px}
.fig .mass{position:absolute;transform-origin:50% 100%}
.fig .mass.band{transform-origin:50% 0}
.fig .sub{font:400 19px/1 'Noto Sans JP',system-ui,sans-serif;color:#6d6456;margin-top:10px;letter-spacing:.04em}
.fig .kw{font:500 16px/1 'JetBrains Mono',ui-monospace,monospace;color:#6d6456;letter-spacing:.12em}
.fig .step .head,.fig .tn .head{text-align:center;border-bottom-color:transparent}
.fig .step .ti{font-size:26px}
.fig .card .head,.fig .pill .head{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom-color:transparent}
.fig .card .ti{font-size:25px}
.fig .stage .head .kw{display:block;margin-bottom:10px}
.fig .node .head{position:relative;padding-right:78px}
.fig .node .ico{position:absolute;right:22px;top:50%;margin-top:-20px}
.fig .zone{margin:0;padding:0;display:block;border:0}
.fig .zl{position:absolute;left:26px;top:20px;display:flex;align-items:baseline;gap:14px}
.fig .zl .nm{font-size:24px;font-weight:700;color:#2b2620}
.fig .zl .kw{color:#6d6456}
.fig .cls .head{text-align:center}
.fig .cls .head .kw{margin-bottom:9px;letter-spacing:.2em}
.fig .cls .ops{border-top:1.5px solid color-mix(in srgb, #2b2620 40%, transparent)}
.fig .panel.narrow .split .rows{width:190px}
.fig .mass.bar{transform-origin:0 50%}
.fig .mass.bar.mid{transform-origin:50% 50%}
.fig svg .tag-wrap{transform-box:fill-box;transform-origin:50% 50%}






  .fig .mass{background:repeating-linear-gradient(-58deg,var(--col) 0 3px,transparent 3px 10px);
