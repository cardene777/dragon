<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* 見本帳の「生成りに茶」 と同じ色を使う = 提案の頁と実物で地の色が変わらない */
  :root {
    --paper: #ece5d8;
    --stripe: #f5efe4;
    --card: #fbf7ef;
    --ink: #3a2e1f;
    --dim: #7a6a53;
    --rule: #d6c9b2;
    --line: #7d5c31;
    --teal: #2f6f62;
    --oshi: #a8521f;
    --shade: 0 1px 2px rgba(58, 46, 31, 0.08), 0 8px 24px rgba(58, 46, 31, 0.06);
    --veil: rgba(28, 22, 14, 0.94);
    --veil-ink: #ece5d8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1c1710;
      --stripe: #241e15;
      --card: #2a2318;
      --ink: #ece5d8;
      --dim: #a79a82;
      --rule: #4a3f2e;
      --line: #c79a5c;
      --teal: #6fb9a8;
      --oshi: #e08a4c;
      --shade: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
      --veil: rgba(10, 8, 5, 0.96);
      --veil-ink: #ece5d8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1c1710;
    --stripe: #241e15;
    --card: #2a2318;
    --ink: #ece5d8;
    --dim: #a79a82;
    --rule: #4a3f2e;
    --line: #c79a5c;
    --teal: #6fb9a8;
    --oshi: #e08a4c;
    --shade: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
    --veil: rgba(10, 8, 5, 0.96);
    --veil-ink: #ece5d8;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding-block: 40px 72px;
    padding-inline: 16px;
    background: var(--paper);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1120px; margin-inline: auto; display: flex; flex-direction: column; gap: 40px; }

  header { display: flex; flex-direction: column; gap: 14px; }
  .eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dim);
  }
  h1 {
    font-family: "Zen Old Mincho", serif;
    font-weight: 700;
    font-size: clamp(26px, 4.2vw, 38px);
    line-height: 1.35;
    margin: 0;
    text-wrap: balance;
  }
  .lead { margin: 0; max-width: 62ch; color: var(--ink); }
  .ask {
    margin: 0;
    padding: 14px 18px;
    border-inline-start: 3px solid var(--oshi);
    background: var(--stripe);
    border-radius: 0 10px 10px 0;
    font-weight: 500;
  }

  h2 {
    font-family: "Zen Old Mincho", serif;
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 14px;
  }

  .scroll { overflow-x: auto; min-width: 0; }
  table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 14px; }
  th, td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
  }
  th {
    font-weight: 600;
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  td.num { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  tr[data-oshi="1"] td { background: color-mix(in srgb, var(--oshi) 8%, transparent); }

  .cards { display: grid; gap: 26px; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }
  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 14px;
    box-shadow: var(--shade);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
  }
  .card[data-oshi="1"] { border-color: var(--oshi); }
  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card-head h3 { font-family: "Zen Old Mincho", serif; font-size: 20px; margin: 0; font-weight: 600; }
  .badge {
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--oshi);
    color: var(--card);
    font-weight: 700;
  }
  .card p { margin: 0; color: var(--dim); font-size: 14px; }

  figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
  figcaption {
    font-size: 12px;
    color: var(--dim);
    font-family: "JetBrains Mono", ui-monospace, monospace;
  }
  .shot {
    display: block;
    width: 100%;
    padding: 0;
    border: 1px solid var(--rule);
    border-radius: 10px;
    background: var(--stripe);
    cursor: zoom-in;
    overflow: hidden;
    line-height: 0;
  }
  .shot img { width: 100%; height: auto; display: block; }
  .shot:focus-visible { outline: 2px solid var(--oshi); outline-offset: 3px; }

  .hint {
    font-size: 13px;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hint::before {
    content: "";
    width: 11px;
    height: 11px;
    border: 1.5px solid var(--dim);
    border-radius: 50%;
    flex: none;
  }

  /* 全画面で原寸。 図は横長なので、原寸で見えないと端の数と印の隙間が判定できない */
  #zoom {
    position: fixed;
    inset: 0;
    margin: 0;
    padding: 0;
    border: 0;
    max-width: 100vw;
    max-height: 100vh;
    width: 100vw;
    height: 100vh;
    background: var(--veil);
    overflow: auto;
    cursor: zoom-out;
  }
  #zoom::backdrop { background: var(--veil); }
  #zoom img { display: block; margin: auto; min-width: min-content; }
  #zoom .cap {
    position: sticky;
    top: 0;
    left: 0;
    padding: 10px 16px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--veil-ink);
    background: rgba(0, 0, 0, 0.45);
  }

  footer { color: var(--dim); font-size: 13px; border-top: 1px solid var(--rule); padding-top: 18px; }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">__EYEBROW__</div>
    <h1>__TITLE__</h1>
    <p class="lead">__LEAD__</p>
    <p class="ask">__ASK__</p>
  </header>

  <!--{TABLE}-->

  <section>
    <h2>候補</h2>
    <p class="hint">絵をクリックすると全画面で原寸に出る。 もう一度クリックするか Esc で閉じる</p>
    <div class="cards">
      <!--{CARDS}-->
    </div>
  </section>

  <!--{NOTES}-->

  <footer>__FOOTER__</footer>
</div>

<dialog id="zoom">
  <div class="cap"></div>
  <img alt="">
</dialog>

<script>
  (function () {
    var dlg = document.getElementById("zoom");
    var img = dlg.querySelector("img");
    var cap = dlg.querySelector(".cap");

    function open(src, alt, caption) {
      img.src = src;
      img.alt = alt;
      cap.textContent = caption;
      if (typeof dlg.showModal === "function") dlg.showModal();
      else dlg.setAttribute("open", "");
      dlg.scrollTop = 0;
      dlg.scrollLeft = 0;
    }

    document.querySelectorAll(".shot").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var el = btn.querySelector("img");
        open(el.getAttribute("src"), el.getAttribute("alt"), btn.dataset.cap || "");
      });
    });

    // 絵そのものを押しても閉じる = 原寸が画面より小さい時に外側を狙わせない
    dlg.addEventListener("click", function () {
      if (typeof dlg.close === "function") dlg.close();
      else dlg.removeAttribute("open");
    });
  })();
</script>
